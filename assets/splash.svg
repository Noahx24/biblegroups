<?xml version="1.0" encoding="UTF-8"?>
<!--
  ChurchFlow splash screen — cross & flow.
  1242×2688 portrait on a cream field: centred scarlet badge (double gold
  ring, cross + flow waves) with the ChurchFlow wordmark and tagline.
  Expo scales/contains this to fit any device (app.json splash.backgroundColor
  is the same cream so the edges blend).
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1242" height="2688" viewBox="0 0 1242 2688">
  <rect width="1242" height="2688" fill="#FAF6EC"/>

  <!-- Cross & flow badge, centred (same mark as the app icon, scaled into a disc) -->
  <g transform="translate(621 1080) scale(0.585) translate(-512 -512)">
    <circle cx="512" cy="512" r="496" fill="#B0202C"/>
    <circle cx="512" cy="512" r="470" fill="none" stroke="#C89441" stroke-width="6"/>
    <circle cx="512" cy="512" r="446" fill="none" stroke="#C89441" stroke-width="4"/>
    <g fill="#FAF6EC">
      <rect x="471" y="250" width="82" height="268" rx="8"/>
      <rect x="364" y="316" width="296" height="82" rx="8"/>
    </g>
    <g fill="none" stroke-width="24" stroke-linecap="round">
      <path stroke="#C89441" d="M 230 700 C 350 640 432 640 512 692 C 592 744 674 744 794 686"/>
      <path stroke="#FAF6EC" d="M 230 662 C 350 722 432 722 512 670 C 592 618 674 618 794 676"/>
    </g>
  </g>

  <!-- Wordmark + tagline -->
  <text x="621" y="1520" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="132" fill="#B0202C" letter-spacing="-2">ChurchFlow</text>
  <text x="621" y="1605" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="50" fill="#C89441" letter-spacing="1">Connecting our church community</text>
</svg>
